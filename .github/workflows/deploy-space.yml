name: Deploy to Hugging Face Space

# Publishes the app to https://huggingface.co/spaces/mattrf/Blur-Tool, but only after the Tests
# workflow has passed on main. The Space is a Docker Space built from this repo's Dockerfile, so it
# installs exactly what CI tested, including the second-step Pillow install from
# requirements-overrides.txt (a Gradio-SDK Space installs requirements and Gradio in one pip
# command, which can't get past Gradio's pillow<13 cap).
# Uploaded: app.py, Dockerfile, requirements.txt, requirements-overrides.txt, and
# huggingface/README.md as README.md (the Space settings header). Nothing else leaves GitHub.
# Needs a Hugging Face write token saved as the repository secret HF_TOKEN; without it the job
# skips with a warning.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Assemble the Space
        run: |
          mkdir space
          cp app.py Dockerfile requirements.txt requirements-overrides.txt space/
          cp huggingface/README.md space/README.md
          ls space

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::The HF_TOKEN secret is not set, so the Space was not updated."
            exit 0
          fi
          pip install -r huggingface/deploy-requirements.txt
          hf upload mattrf/Blur-Tool space . --repo-type space --commit-message "Deploy ${SHA::7} from GitHub"
